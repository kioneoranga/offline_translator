name: Build models (OPUS-MT -> CTranslate2 int8)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils de conversion
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.40,<5" "ctranslate2>=4.4,<5" sentencepiece

      - name: Convertir les modèles officiels Helsinki-NLP
        run: |
          mkdir -p out
          for p in en-fr fr-en; do
            ct2-transformers-converter --model Helsinki-NLP/opus-mt-$p \
              --output_dir out/opus-mt-$p --quantization int8 \
              --copy_files source.spm target.spm --force
            ls -la out/opus-mt-$p
          done

      - name: Test de traduction (avec le vrai code de l'application)
        run: |
          python - <<'PYEOF'
          import sys, pathlib
          sys.path.insert(0, "src")
          from otranslate.core.translator import _Engine
          from otranslate.core import segmenter
          tests = {
              "en-fr": "The weather is nice today. We are going to the beach, and then we will have dinner.",
              "fr-en": "Il fait beau aujourd'hui. Nous allons à la plage, puis nous dînerons.",
          }
          for pair, text in tests.items():
              eng = _Engine(pathlib.Path("out") / f"opus-mt-{pair}", 0)
              sents = [v for is_text, v in segmenter.split(segmenter.normalize(text)) if is_text]
              outs = eng.run(sents, 4)
              print(pair, outs)
              assert outs and all(o.strip() for o in outs)
          PYEOF

      - name: Zipper
        run: |
          cd out
          for p in en-fr fr-en; do zip -rq ../opus-mt-$p.zip opus-mt-$p; done
          cd ..
          ls -la *.zip

      - name: Publier la release models-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete models-v1 --yes --cleanup-tag || true
          gh release create models-v1 opus-mt-en-fr.zip opus-mt-fr-en.zip \
            --title "Modèles de traduction v1" \
            --notes "OPUS-MT en-fr / fr-en convertis en CTranslate2 (int8). Téléchargés automatiquement par l'application au premier lancement."
