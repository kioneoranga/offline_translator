name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # bouton "Run workflow" dans l'onglet Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests du cœur
        run: python -m unittest discover tests

      - name: Construire l'exécutable
        run: pyinstaller --noconfirm --clean OfflineTranslator.spec

      - name: Préparer les dossiers portables
        run: |
          New-Item -ItemType Directory -Force dist\OfflineTranslator\models, dist\OfflineTranslator\data | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineTranslator-windows
          path: dist/OfflineTranslator
